name: Android CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && 'google-play-production' || format('check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Run unit tests and lint
        run: ./gradlew test lint --stacktrace
      - name: Set unique Play Store version code
        if: github.event_name == 'push'
        run: echo "CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Restore release keystore
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cameracontrol-release.jks"
      - name: Verify release keystore certificate
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ACTUAL_FINGERPRINT=$(keytool -exportcert -keystore "$RUNNER_TEMP/cameracontrol-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl x509 -inform DER -noout -fingerprint -sha256 | sed 's/^.*=//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          EXPECTED_FINGERPRINT=$(tr -d '[:space:]:' < .github/release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL_FINGERPRINT"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
      - name: Build signed release bundle
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cameracontrol-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: camera-control-${{ env.CI_VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish to Google Play production
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.cameracontrol
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
